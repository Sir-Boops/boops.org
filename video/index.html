<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Player</title>
  <meta name="description" content="Play a video from a URL and choose its streaming quality.">
  <link rel="stylesheet" href="./player.css?v=f6ada24">
  <script src="./hls.min.js?v=1.7.4" defer></script>
  <script src="./player.js?v=5fd78fb" defer></script>
</head>
<body>
  <main class="player">
    <h1>Video player</h1>
    <div class="screen">
      <video id="video" aria-label="Video" controls playsinline preload="auto" hidden></video>
      <div class="empty" id="empty" hidden>
        <span class="play-icon" aria-hidden="true"></span>
        <p>Open this page with a video URL in <code>?src=</code>.</p>
      </div>
    </div>
    <p class="resolution" id="resolution" hidden></p>
    <div class="toolbar" id="toolbar" hidden>
      <label for="quality">Quality</label>
      <select id="quality"><option value="auto">Auto</option></select>
    </div>
    <p class="status" id="status" role="status" hidden></p>
    <noscript><p>Turn on JavaScript to load a video from the URL.</p></noscript>
  </main>
</body>
</html>
