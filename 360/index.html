<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>360° Video Player</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #080809;
      color: #f6f3ef;
      --panel: rgba(25, 23, 25, .94);
      --border: rgba(246, 243, 239, .18);
      --accent: #ffb6a3;
      --muted: #d5cfd1;
    }

    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; }
    [hidden] { display: none !important; }

    #controls {
      position: fixed;
      z-index: 10;
      inset-inline: max(12px, env(safe-area-inset-left)) max(12px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      max-width: 680px;
      margin-inline: auto;
      padding: 3px clamp(10px, 2vw, 16px) 10px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 8px 32px rgba(0, 0, 0, .32);
      backdrop-filter: blur(14px);
      font-size: .875rem;
    }

    .timeline {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }

    .timestamp { min-width: 4ch; }
    #duration { color: var(--muted); text-align: right; }
    #duration.live { color: var(--accent); font-weight: 650; }

    .actions, .audio, .view {
      display: flex;
      align-items: center;
    }

    .actions { justify-content: space-between; gap: 6px; }
    .audio { gap: 4px; }
    .view { gap: 8px; margin-left: auto; }

    .control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #playPause {
      min-width: 94px;
      padding-inline: 10px;
      border-color: var(--border);
      background: #302422;
      color: var(--accent);
      font-weight: 650;
    }

    @media (hover: hover) {
      .control:hover:not(:disabled) { background: #343034; }
      #playPause:hover:not(:disabled) { background: #45302b; }
    }

    .control:active:not(:disabled) { background: #343034; }
    #playPause:active:not(:disabled) { background: #45302b; }
    .control:disabled { opacity: .45; cursor: default; }
    #controls :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .icon {
      display: inline-grid;
      place-items: center;
      position: relative;
      width: 18px;
      height: 18px;
      flex: none;
    }

    .play-icon::before {
      content: '';
      width: 12px;
      height: 14px;
      background: currentColor;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }

    .is-playing .play-icon::before {
      background: linear-gradient(to right, currentColor 4px, transparent 4px 8px, currentColor 8px);
      clip-path: none;
    }

    .volume-icon::before {
      content: '';
      position: absolute;
      inset: 2px auto 2px 0;
      width: 10px;
      background: currentColor;
      clip-path: polygon(0 30%, 40% 30%, 100% 0, 100% 100%, 40% 70%, 0 70%);
    }

    .volume-icon::after {
      content: '';
      position: absolute;
      right: 0;
      width: 12px;
      height: 14px;
      border: 2px solid transparent;
      border-right-color: currentColor;
      border-radius: 50%;
    }

    .is-muted .volume-icon::after {
      content: '×';
      width: auto;
      height: auto;
      border: 0;
      font: 650 13px/1 system-ui, sans-serif;
    }

    .fullscreen-icon span {
      position: absolute;
      width: 6px;
      height: 6px;
      border: solid currentColor;
      border-width: 2px 0 0 2px;
      transform: rotate(calc(var(--corner) + var(--turn, 0deg)));
    }

    .fullscreen-icon span:nth-child(1) { top: 1px; left: 1px; --corner: 0deg; }
    .fullscreen-icon span:nth-child(2) { top: 1px; right: 1px; --corner: 90deg; }
    .fullscreen-icon span:nth-child(3) { bottom: 1px; right: 1px; --corner: 180deg; }
    .fullscreen-icon span:nth-child(4) { bottom: 1px; left: 1px; --corner: 270deg; }
    .is-fullscreen .fullscreen-icon { --turn: 180deg; }

    .range {
      display: block;
      width: 100%;
      min-width: 0;
      height: 44px;
      margin: 0;
      padding: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .range:disabled { opacity: .45; cursor: default; }
    #volume { width: clamp(62px, 15vw, 100px); }

    .resolution {
      display: grid;
      gap: 2px;
      flex: none;
      margin: 0 0 0 4px;
      padding-inline-start: 10px;
      border-inline-start: 1px solid var(--border);
      color: var(--muted);
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .resolution strong { color: #f6f3ef; font-weight: 650; }
    .look-hint { margin: 0 4px 0 0; color: var(--muted); white-space: nowrap; }

    @media (max-width: 660px) {
      .look-hint { display: none; }
    }

    @media (max-width: 480px) {
      .actions { flex-wrap: wrap; }
      .resolution {
        display: flex;
        gap: 6px;
        order: 1;
        flex-basis: 100%;
        margin: 0;
        padding: 4px 0 0;
        border: 0;
      }
    }

    @media (max-width: 350px) {
      #playPause { min-width: 90px; padding-inline: 8px; }
      #volume { width: 44px; }
      .actions { gap: 3px; }
      .audio { gap: 2px; }
      .view { gap: 0; }
    }

    #status {
      position: fixed;
      z-index: 10;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: max-content;
      max-width: calc(100% - 32px);
      margin: 0;
      text-align: center;
      pointer-events: none;
    }

    #status:not(:empty) {
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }

    /* A-Frame supplies the permission dialog and handles the browser request. */
    a-scene .a-modal {
      display: grid;
      place-items: center;
      place-items: safe center;
      overflow: auto;
      padding: 16px;
      background: rgba(0, 0, 0, .76);
    }

    a-scene .a-modal .a-dialog {
      inset: auto;
      transform: none;
      width: min(100%, 380px);
      height: auto;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #191719;
      color: #f6f3ef;
      font: 1rem/1.5 Inter, system-ui, sans-serif;
    }

    a-scene .a-modal .a-dialog-text-container { height: auto; }
    a-scene .a-modal .a-dialog-text { margin: 0; font: inherit; }

    a-scene .a-modal .a-dialog-buttons-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      height: auto;
      margin-top: 16px;
    }

    a-scene .a-modal .a-dialog-button {
      flex: 1 0 auto;
      width: auto;
      height: auto;
      min-height: 44px;
      margin: 0;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #302d30;
      color: #f6f3ef;
      opacity: 1;
      font: 650 1rem/1.25 Inter, system-ui, sans-serif;
    }

    a-scene .a-modal .a-dialog-allow-button { background: var(--accent); color: #211815; }
    a-scene .a-modal .a-dialog-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <video id="video" crossorigin="anonymous" playsinline preload="metadata" hidden></video>
  <a-scene background="color: #080809" xr-mode-ui="enterVRButton: #enterVR"
    device-orientation-permission-ui="deviceMotionMessage: Allow motion access to look around by moving your phone. You can also drag to look around.; denyButtonText: Not now">
    <a-entity camera look-controls="reverseMouseDrag: true" position="0 1.6 0"></a-entity>
    <a-videosphere id="videosphere" rotation="0 -90 0" radius="500" visible="false"></a-videosphere>
  </a-scene>

  <p id="status" role="status"></p>
  <div id="controls" role="group" aria-label="Video controls">
    <div class="timeline">
      <span class="timestamp" id="currentTime">0:00</span>
      <input class="range" id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" disabled>
      <span class="timestamp" id="duration">—</span>
    </div>
    <div class="actions">
      <button class="control" id="playPause" type="button" aria-keyshortcuts="Space" title="Play (Space)" disabled>
        <span class="icon play-icon" aria-hidden="true"></span><span id="playLabel">Play</span>
      </button>
      <div class="audio" role="group" aria-label="Audio">
        <button class="control" id="mute" type="button" aria-label="Mute" title="Mute" disabled>
          <span class="icon volume-icon" aria-hidden="true"></span>
        </button>
        <input class="range" id="volume" type="range" min="0" max="100" value="100" aria-label="Volume" disabled>
      </div>
      <p class="resolution" id="resolution" hidden><span>Resolution</span> <strong id="resolutionValue"></strong></p>
      <div class="view">
        <p class="look-hint">Drag to look around</p>
        <button class="control" id="enterVR" type="button" aria-label="Enter VR" title="Enter VR" hidden>VR</button>
        <button class="control" id="fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen" hidden>
          <span class="icon fullscreen-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const scene = document.querySelector('a-scene');
    const videosphere = document.getElementById('videosphere');
    const status = document.getElementById('status');
    const playPause = document.getElementById('playPause');
    const playLabel = document.getElementById('playLabel');
    const seek = document.getElementById('seek');
    const currentTime = document.getElementById('currentTime');
    const duration = document.getElementById('duration');
    const mute = document.getElementById('mute');
    const volume = document.getElementById('volume');
    const resolution = document.getElementById('resolution');
    const resolutionValue = document.getElementById('resolutionValue');
    const enterVR = document.getElementById('enterVR');
    const fullscreen = document.getElementById('fullscreen');
    let streamIsLive = false;
    let mediaFailed = false;
    let lastVolume = video.volume || 1;

    function labelButton(button, label) {
      button.setAttribute('aria-label', label);
      button.title = label;
    }

    function showMediaError(message) {
      mediaFailed = true;
      playPause.disabled = seek.disabled = mute.disabled = volume.disabled = true;
      resolution.hidden = true;
      status.textContent = message;
    }

    function syncResolution() {
      const { videoWidth, videoHeight } = video;
      resolution.hidden = mediaFailed || !videoWidth || !videoHeight;
      resolutionValue.textContent = resolution.hidden ? '' : `${videoWidth} × ${videoHeight}`;
    }

    video.addEventListener('loadedmetadata', syncResolution);
    video.addEventListener('resize', syncResolution);
    video.addEventListener('emptied', () => { resolution.hidden = true; });

    function formatTime(seconds) {
      const total = Math.floor(Math.max(0, seconds));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor(total / 60) % 60;
      const remainder = String(total % 60).padStart(2, '0');
      return hours ? `${hours}:${String(minutes).padStart(2, '0')}:${remainder}` : `${minutes}:${remainder}`;
    }

    function seekWindow() {
      if (streamIsLive || video.duration === Infinity) {
        const lastRange = video.seekable.length - 1;
        return lastRange < 0 ? [0, 0] : [video.seekable.start(lastRange), video.seekable.end(lastRange)];
      }
      return [0, Number.isFinite(video.duration) ? video.duration : 0];
    }

    function syncTimeline() {
      const live = streamIsLive || video.duration === Infinity;
      const [start, end] = seekWindow();
      const position = Math.min(end, Math.max(start, video.currentTime));
      const behind = formatTime(end - position);
      const elapsed = formatTime(video.currentTime);
      seek.disabled = mediaFailed || end <= start;
      seek.value = end > start ? (position - start) / (end - start) * seek.max : 0;
      seek.setAttribute('aria-valuetext', live ? `${behind} behind live` : `${elapsed} of ${formatTime(end)}`);
      currentTime.textContent = live ? (end - position >= 1 ? `−${behind}` : '0:00') : elapsed;
      duration.textContent = live ? 'Live' : (end > 0 ? formatTime(end) : '—');
      duration.classList.toggle('live', live);
    }

    for (const event of ['loadedmetadata', 'durationchange', 'timeupdate', 'progress', 'emptied']) {
      video.addEventListener(event, syncTimeline);
    }

    seek.addEventListener('input', () => {
      const [start, end] = seekWindow();
      if (end > start) video.currentTime = start + (end - start) * (seek.value / seek.max);
      syncTimeline();
    });

    function syncPlayback() {
      const playing = !video.paused && !video.ended;
      playPause.classList.toggle('is-playing', playing);
      playLabel.textContent = playing ? 'Pause' : (video.ended ? 'Replay' : 'Play');
      playPause.title = `${playLabel.textContent} (Space)`;
    }

    for (const event of ['play', 'pause', 'ended']) {
      video.addEventListener(event, syncPlayback);
    }

    async function togglePlayback() {
      if (!video.paused && !video.ended) {
        video.pause();
        return;
      }
      try {
        await video.play();
      } catch (error) {
        syncPlayback();
        if (!mediaFailed && error.name !== 'AbortError') {
          status.textContent = 'Playback couldn’t start. Select Play to try again.';
        }
      }
    }

    playPause.addEventListener('click', togglePlayback);
    document.addEventListener('keydown', event => {
      if (event.key !== ' ' || event.defaultPrevented || playPause.disabled ||
          event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
      if (event.target instanceof Element &&
          event.target.closest('button, select, textarea, input:not([type="range"]), [contenteditable]')) return;
      event.preventDefault();
      if (!event.repeat) togglePlayback();
    });

    function syncVolume() {
      if (video.volume > 0) lastVolume = video.volume;
      const silent = video.muted || video.volume === 0;
      mute.classList.toggle('is-muted', silent);
      labelButton(mute, silent ? 'Unmute' : 'Mute');
      volume.value = video.muted ? 0 : Math.round(video.volume * 100);
    }

    const initialVolume = video.volume;
    video.volume = initialVolume === 1 ? .5 : 1;
    volume.hidden = video.volume === initialVolume;
    video.volume = initialVolume;

    video.addEventListener('volumechange', syncVolume);
    mute.addEventListener('click', () => {
      const silent = video.muted || video.volume === 0;
      if (video.volume === 0) video.volume = lastVolume;
      video.muted = !silent;
      syncVolume();
    });
    volume.addEventListener('input', () => {
      video.volume = volume.value / 100;
      video.muted = false;
      syncVolume();
    });

    const root = document.documentElement;
    const requestFullscreen = root.requestFullscreen || root.webkitRequestFullscreen;
    const exitFullscreen = document.exitFullscreen || document.webkitExitFullscreen;
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    fullscreen.hidden = !requestFullscreen || !exitFullscreen ||
      (document.fullscreenEnabled ?? document.webkitFullscreenEnabled) === false;

    function syncFullscreen() {
      const active = Boolean(fullscreenElement());
      fullscreen.classList.toggle('is-fullscreen', active);
      labelButton(fullscreen, active ? 'Exit fullscreen' : 'Enter fullscreen');
    }

    document.addEventListener('fullscreenchange', syncFullscreen);
    document.addEventListener('webkitfullscreenchange', syncFullscreen);
    fullscreen.addEventListener('click', async () => {
      try {
        if (fullscreenElement()) await exitFullscreen.call(document);
        else await requestFullscreen.call(root);
      } catch {
        if (!mediaFailed) status.textContent = 'Fullscreen is unavailable.';
      }
    });

    function syncVR() {
      enterVR.hidden = !window.AFRAME?.utils.device.checkVRSupport();
    }

    scene.addEventListener('update-vr-devices', syncVR);
    scene.addEventListener('loaded', syncVR);

    function showVideo() {
      if (!mediaFailed) {
        videosphere.setAttribute('visible', true);
        status.textContent = '';
      }
    }

    video.addEventListener('loadeddata', showVideo);
    video.addEventListener('playing', showVideo);
    video.addEventListener('error', () => showMediaError('This video couldn’t be loaded. Check the stream URL.'));

    function loadVideo(url) {
      if (!url) {
        showMediaError('Add a stream URL with the ?url= parameter.');
        return;
      }
      if (!window.AFRAME) {
        showMediaError('The 360° viewer couldn’t load. Reload the page to try again.');
        return;
      }
      status.textContent = 'Loading video…';
      videosphere.setAttribute('src', '#video');
      if (window.Hls?.isSupported()) {
        const hls = new Hls();
        hls.on(Hls.Events.LEVEL_LOADED, (_, { details }) => {
          streamIsLive = details.live;
          syncTimeline();
        });
        hls.on(Hls.Events.ERROR, (_, { fatal }) => {
          if (fatal) showMediaError('This stream couldn’t be played. Check the stream URL and reload.');
        });
        hls.loadSource(url);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
      } else {
        showMediaError('This browser can’t play HLS video.');
        return;
      }
      playPause.disabled = mute.disabled = volume.disabled = false;
    }

    loadVideo(new URLSearchParams(window.location.search).get('url'));
  </script>
</body>
</html>
