<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gas price converter - boops.org</title>
</head>
<body>
    <h1>Gas price converter</h1>
    <p>
        <label for="usd">US dollars per US gallon:</label><br>
        <input type="number" id="usd" min="0" step="any" value="3.50" aria-describedby="rate-status">
    </p>
    <p>
        <label for="cad">Canadian dollars per liter:</label><br>
        <input type="number" id="cad" min="0" step="any" aria-describedby="rate-status">
    </p>
    <p id="rate-status" role="status">Loading USD to CAD exchange rate...</p>
    <button type="button" id="retry" hidden>Retry exchange rate</button>
    <noscript>JavaScript is needed to fetch the exchange rate and convert the price.</noscript>
    <p><a href="../">Home</a></p>
    <script>
    (() => {
        const usd = document.getElementById("usd");
        const cad = document.getElementById("cad");
        const status = document.getElementById("rate-status");
        const retry = document.getElementById("retry");
        const litersPerGallon = 3.785411784;
        let rate = null;
        let lastEdited = usd;

        function convert(source) {
            lastEdited = source;
            const target = source === usd ? cad : usd;
            const amount = source.valueAsNumber;
            const multiplier = source === usd ? rate / litersPerGallon : litersPerGallon / rate;
            const converted = amount * multiplier;
            target.value = rate !== null && source.validity.valid &&
                Number.isFinite(amount) && amount >= 0 && Number.isFinite(converted)
                ? converted.toFixed(3) : "";
        }

        async function loadRate() {
            retry.hidden = true;
            status.textContent = "Loading USD to CAD exchange rate...";
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            try {
                const response = await fetch("https://api.frankfurter.dev/v2/rate/USD/CAD", {
                    signal: controller.signal, credentials: "omit"
                });
                if (!response.ok) throw new Error("Request failed");
                const data = await response.json();
                if (data.base !== "USD" || data.quote !== "CAD" ||
                    typeof data.rate !== "number" || !Number.isFinite(data.rate) || data.rate <= 0 ||
                    typeof data.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(data.date)) {
                    throw new Error("Invalid rate");
                }
                rate = data.rate;
                status.textContent = "1 USD = " + rate + " CAD (" + data.date + ").";
                convert(lastEdited);
            } catch {
                status.textContent = "Could not load the exchange rate. Please retry.";
                retry.hidden = false;
            } finally {
                clearTimeout(timeout);
            }
        }

        usd.addEventListener("input", () => convert(usd));
        cad.addEventListener("input", () => convert(cad));
        retry.addEventListener("click", loadRate);
        loadRate();
    })();
    </script>
</body>
</html>
